name: Deploy

on:
  push:
    branches:
      - main

jobs:
  deploy:
    runs-on: ubuntu-latest

    steps:
      - name: Deploy to VPS
        uses: appleboy/ssh-action@v1.2.2
        with:
          host: ${{ secrets.VPS3569400IP }}
          username: deploy
          key: ${{ secrets.VPS3569400 }}
          script: |
            set -e

            cd ~/clients

            echo "Updating code..."
            git fetch origin main
            git reset --hard origin/main

            echo "Checking Docker Compose..."
            docker compose config --quiet

            echo "Building and starting application..."
            docker compose up -d --build php nginx

            echo "Installing Composer dependencies..."
            docker compose exec -T php composer install \
              --no-interaction \
              --prefer-dist \
              --optimize-autoloader

            echo "Running database migrations..."
            docker compose exec -T php php bin/console doctrine:migrations:migrate --no-interaction

            echo "Checking application..."

            HTTP_CODE=$(curl -sS -o /dev/null \
              -w "%{http_code}" \
              https://clients.sharonoff.com/telegram/webhook)

            if [ "$HTTP_CODE" != "405" ]; then
              echo "Unexpected HTTP status: $HTTP_CODE"
              exit 1
            fi

            echo "Application is reachable (HTTP 405 expected for GET webhook)"
            echo "DEPLOY_OK"