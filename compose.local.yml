services:
  nginx:
    image: nginx:alpine
    container_name: clients-local-nginx
    restart: unless-stopped

    ports:
      - "8080:80"

    volumes:
      - ./app:/var/www/html:ro
      - ./docker/nginx/default.local.conf:/etc/nginx/conf.d/default.conf:ro

    depends_on:
      - php

    networks:
      - clients-local-internal

  php:
    build:
      context: .
      dockerfile: Dockerfile

    entrypoint:
      - /bin/sh
      - -c
      - |
        mkdir -p /var/www/html/var
        chown -R www-data:www-data /var/www/html/var
        exec docker-php-entrypoint php-fpm

    container_name: clients-local-php
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8"
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MESSENGER_TRANSPORT_DSN: "amqp://clients_app:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f/messages"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}

    volumes:
      - ./app:/var/www/html
      - clients-local-symfony-var:/var/www/html/var

    networks:
      - clients-local-internal

  postgres:
    image: postgres:18-alpine
    container_name: clients-local-postgres
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}

    volumes:
      - clients-local-postgres-data:/var/lib/postgresql

    networks:
      - clients-local-internal

  rabbitmq:
    image: rabbitmq:4-management-alpine
    container_name: clients-local-rabbitmq
    restart: unless-stopped

    networks:
      - clients-local-internal

  worker:
    build:
      context: .
      dockerfile: Dockerfile

    command:
      - php
      - bin/console
      - messenger:consume
      - async
      - --verbose

    container_name: clients-local-worker
    restart: unless-stopped

    environment:
      POSTGRES_DB: ${POSTGRES_DB}
      POSTGRES_USER: ${POSTGRES_USER}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD}
      DATABASE_URL: "postgresql://${POSTGRES_USER}:${POSTGRES_PASSWORD}@postgres:5432/${POSTGRES_DB}?serverVersion=18&charset=utf8"
      RABBITMQ_PASSWORD: ${RABBITMQ_PASSWORD}
      MESSENGER_TRANSPORT_DSN: "amqp://clients_app:${RABBITMQ_PASSWORD}@rabbitmq:5672/%2f/messages"
      TELEGRAM_BOT_TOKEN: ${TELEGRAM_BOT_TOKEN}
      TELEGRAM_WEBHOOK_SECRET: ${TELEGRAM_WEBHOOK_SECRET}

    volumes:
      - ./app:/var/www/html
      - clients-local-symfony-var:/var/www/html/var

    networks:
      - clients-local-internal

networks:
  clients-local-internal:
    name: clients-local-internal

volumes:
  clients-local-postgres-data:
    name: clients-local-postgres-data

  clients-local-symfony-var:
    name: clients-local-symfony-var
